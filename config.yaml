output_dir: outputs
use_features: True
# Investigator F_selected (paper Eq. 6 approx): off | rules | paper
feature_selection: paper
# Reflector → Investigator feature re-select attempts per window
feature_reselect_max: 3
use_exogenous: True

datasets:
  - name: EPF_NP
    aliases: [np, nordpool]
    training_csv: data/EPF_NP/train.csv
    test_csv: data/EPF_NP/test.csv
    look_back: 168
    predicted_window: 24
    # Day-ahead stride = horizon (N-BEATSx-style); NOT 168 (that under-samples vs long-term stride=H).
    sliding_window: 24
    frequency: h
    checkpoints:
      Autoformer: castmind/DeepLearningCheckpoints/EPF_NP/Autoformer.pth
      DLinear: castmind/DeepLearningCheckpoints/EPF_NP/DLinear.pth
      iTransformer: castmind/DeepLearningCheckpoints/EPF_NP/iTransformer.pth
      PatchTST: castmind/DeepLearningCheckpoints/EPF_NP/PatchTST.pth
      TimesNet: castmind/DeepLearningCheckpoints/EPF_NP/TimesNet.pth
    context_prompt_file: prompts/contextual_briefings/EPF_NP.txt

  - name: EPF_PJM
